<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Painting — Professional Home Painting in Austin, TX</title>
    <meta
      name="description"
      content="Licensed & insured residential painters serving Austin, TX since 2009. Interior, exterior and cabinet painting with crisp lines, honest quotes and clean job sites. Get a free estimate today."
    />
    <meta name="theme-color" content="#06121F" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1D30'/%3E%3Cpath d='M32 13 51 51H40.5L32 33.4 23.5 51H13Z' fill='%23FF6A2B'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Apply a saved brand accent before first paint so the template never flashes the default. */
      try {
        var savedAccent = localStorage.getItem("apex-accent");
        if (savedAccent) document.documentElement.style.setProperty("--accent", savedAccent);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
